:root {
  color-scheme: dark;
  --bg: #000; --surface: #111113; --surface-2: #1c1c20; --line: #2c2c2e; --line-2: #3a3a3e;
  --text: #f5f5f7; --dim: #86868b; --faint: #6e6e73;
  --blue: #2997ff; --blue-deep: #1662b8; --sky: #86b6ef; --red: #ff453a; --amber: #ffd60a; --green: #30d158;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --pixel: "Press Start 2P", ui-monospace, Menlo, monospace;
  --px: 4px; /* one "pixel" of UI chrome */
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--text); font: 17px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; touch-action: manipulation; }
/* faint pixel grid + blue glow behind the board */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(60% 45% at 50% 42%, rgba(41, 151, 255, 0.16), transparent 70%),
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 24px 24px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

/* chrome (matches the CycloneSentinel story: glass nav + thin gradient progress) */
.progress { position: fixed; inset: 0 0 auto; height: 3px; z-index: 70; }
.progress i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0); transition: transform .5s;
  background: linear-gradient(90deg, var(--blue), var(--sky)); }
.nav { position: fixed; inset: 0 0 auto; z-index: 60; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 max(16px, 4vw); background: rgba(0, 0, 0, 0.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font: 11px/1 var(--pixel); letter-spacing: .5px; white-space: nowrap; }
.brand img { height: 32px; image-rendering: pixelated; }
.logo { width: 24px; height: 24px; image-rendering: pixelated; background: var(--blue); }
.nav-right { display: flex; align-items: center; gap: 14px; }
.levels { display: flex; gap: 6px; }
.levels i { width: 10px; height: 10px; background: var(--line-2); }
.levels i.done { background: var(--blue); }
.levels i.cur { background: var(--amber); animation: blink 1s steps(2) infinite; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; color: #d2d2d7; cursor: pointer; }
.icon-btn:hover { color: #fff; }
svg.px { width: 18px; height: 18px; fill: currentColor; shape-rendering: crispEdges; flex: none; }

/* stage */
main { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 76px 16px 32px; }
.head { text-align: center; display: grid; gap: 10px; justify-items: center; }
.eyebrow { margin: 0; font: 10px/1.4 var(--pixel); color: var(--sky); letter-spacing: 1px; text-transform: uppercase; }
#goal { margin: 0; font-size: clamp(19px, 5.4vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.grad { background: linear-gradient(100deg, #e9f3ff 0%, #86b6ef 35%, #2997ff 70%, #7d7aff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dim { color: var(--dim); }
#counter { display: flex; align-items: center; gap: 10px; font: 10px/1 var(--pixel); color: #d2d2d7; }
.pips { display: flex; gap: 6px; }
.pips i { width: 14px; height: 14px; background: var(--blue);
  box-shadow: inset -3px -3px 0 var(--blue-deep), inset 3px 3px 0 rgba(255, 255, 255, .35); }
.pips i.used { background: var(--line-2); box-shadow: inset -3px -3px 0 #26262a; }

/* the board: a pixel-notched frame (4 offset shadows draw a stepped border) */
.frame { --c: var(--line); position: relative; padding: 12px; background: var(--surface); margin: var(--px);
  width: min(calc(100% - 8px), 440px, max(260px, calc(100svh - 330px)));
  box-shadow: 0 calc(-1 * var(--px)) 0 var(--c), 0 var(--px) 0 var(--c), calc(-1 * var(--px)) 0 0 var(--c), var(--px) 0 0 var(--c),
    0 30px 120px rgba(41, 151, 255, 0.22); }
#board { display: grid; gap: 6px; }
.cell { position: relative; aspect-ratio: 1; border: 0; padding: 10%; background: #1a1b22; cursor: pointer; image-rendering: pixelated; }
.cell:hover { filter: brightness(1.25); }
.v { display: block; width: 100%; height: 100%; image-rendering: pixelated; animation: bob 1.2s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 50% { transform: translateY(-6.25%); } } /* one sprite pixel */
.cell.B .v { background: var(--blue); }
.cell.r .v { background: var(--red); }
.cell.hop .v { animation: hop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hop { 0% { transform: none; } 40% { transform: translateY(-26%) scale(1.06, .94); } 75% { transform: scale(1.12, .86); } 100% { transform: none; } }
.cell .tie { position: absolute; right: 3px; bottom: 3px; display: none; min-width: 18px; padding: 3px 2px 2px; text-align: center;
  font: 9px/1 var(--pixel); color: #14121f; background: var(--amber); box-shadow: inset -2px -2px 0 #c79a00; }
.cell.tied .tie { display: block; }
.cell.pinned { box-shadow: inset 0 0 0 3px var(--amber); }
.cell.pinned .v { animation: none; filter: drop-shadow(0 0 6px rgba(255, 214, 10, .65)); }
.cell.hint::before { content: ""; position: absolute; inset: -5px; z-index: 1; pointer-events: none; border: 4px solid var(--sky); animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* controls: chunky pixel buttons */
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.btn { --c: var(--line-2); display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; margin: var(--px); border: 0; cursor: pointer;
  font: 10px/1 var(--pixel); letter-spacing: .5px; text-transform: uppercase; background: var(--surface-2); color: var(--text);
  box-shadow: 0 calc(-1 * var(--px)) 0 var(--c), 0 var(--px) 0 var(--c), calc(-1 * var(--px)) 0 0 var(--c), var(--px) 0 0 var(--c), inset 0 -4px 0 rgba(0, 0, 0, .45);
  transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.2); }
.btn:active { transform: translateY(2px); }
.btn.primary { --c: var(--blue-deep); background: var(--blue); color: #fff; box-shadow: 0 calc(-1 * var(--px)) 0 var(--c), 0 var(--px) 0 var(--c), calc(-1 * var(--px)) 0 0 var(--c), var(--px) 0 0 var(--c), inset 0 -5px 0 var(--blue-deep); }
kbd { font: 9px/1 var(--pixel); padding: 4px 5px 3px; color: var(--dim); background: #000; }
.btn.primary kbd { color: #cde2fb; background: var(--blue-deep); }
@media (hover: none) { kbd { display: none; } }
#msg { min-height: 1.5em; margin: 0; color: var(--dim); font-size: 15px; text-align: center; }

/* win / fail */
#overlay { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px;
  background: rgba(0, 0, 0, 0.62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#overlay.show { display: flex; }
.card { --c: var(--line-2); width: min(100%, 420px); padding: 32px 24px 28px; text-align: center; display: grid; gap: 14px; justify-items: center;
  background: linear-gradient(160deg, #15161a, #0b0b0d); margin: var(--px); animation: rise .28s cubic-bezier(.2, 1.4, .4, 1);
  box-shadow: 0 calc(-1 * var(--px)) 0 var(--c), 0 var(--px) 0 var(--c), calc(-1 * var(--px)) 0 0 var(--c), var(--px) 0 0 var(--c), 0 40px 120px rgba(41, 151, 255, .18); }
@keyframes rise { from { transform: translateY(16px) scale(.94); opacity: 0; } }
#result { margin: 0; font-size: clamp(34px, 9vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
#overlay.lost { background: rgba(0, 0, 0, 0.45); backdrop-filter: none; -webkit-backdrop-filter: none; align-items: flex-end; } /* keep the near-miss visible */
#overlay.lost .eyebrow { color: var(--red); }
#overlay.lost #result { color: var(--text); }
#badge { font: 10px/1 var(--pixel); color: #04170a; background: var(--green); padding: 8px 10px 7px; box-shadow: inset -3px -3px 0 #1f9a3f; }
.card .btn { margin-top: 6px; }

/* screen shake + pixel confetti on win */
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } }
.bit { position: fixed; top: -12px; z-index: 50; width: 8px; height: 8px; pointer-events: none; animation: fall var(--t) steps(14) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 108vh) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}

<script id="rules">
// Board: string of 'B' (blue) / 'r' (red), row-major, square. pin: cell index, or -1 for none.
// Returns [blue, red] counts among the up/down/left/right neighbours of cell i.
function votes(board, i) {
  const n = Math.sqrt(board.length), x = i % n, y = (i - x) / n;
  let b = 0, r = 0;
  for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
    board[ny * n + nx] === 'B' ? b++ : r++;
  }
  return [b, r];
}

function step(board, pin) {
  let out = '';
  for (let i = 0; i < board.length; i++) {
    const [b, r] = votes(board, i);
    out += i === pin || b === r ? board[i] : b > r ? 'B' : 'r';
  }
  return out;
}

const isWin = board => !board.includes('r');

// Cells whose neighbours are split evenly (they keep their colour next turn).
const tied = board => [...board].map((_, i) => { const [b, r] = votes(board, i); return b === r; });

// BFS: shortest list of pins that wins within `turns`, or null.
function solve(board, turns) {
  if (isWin(board)) return [];
  let layer = new Map([[board, []]]);
  const seen = new Set([board]);
  for (let t = 0; t < turns; t++) {
    const next = new Map();
    for (const [b, path] of layer) {
      for (let p = 0; p < b.length; p++) {
        const nb = step(b, p);
        if (isWin(nb)) return [...path, p];
        if (!seen.has(nb)) { seen.add(nb); next.set(nb, [...path, p]); }
      }
    }
    layer = next;
  }
  return null;
}

// Run with no pins until the board repeats; true if it ever becomes all blue.
function idleWins(board) {
  const seen = new Set();
  while (!seen.has(board)) {
    if (isWin(board)) return true;
    seen.add(board);
    board = step(board, -1);
  }
  return false;
}

  music: '',

// Generated by gen.js: [board, turn limit]. Shortest win equals the limit; doing nothing never wins.
const LEVELS = [["rBrrBrBBB",2],["BBBrBrBrB",2],["BBrBrBrrB",3],["BBBBrBrrrrBrBrBB",3],["BBBrBrBrrBrBrBrB",3],["rBBrrBrBrBBBBrBrrBBBrBrrr",4]];

const $ = id => document.getElementById(id);

// Pixel icons: '#' = filled pixel.
const ICONS = {
  undo: ['...#.....', '..##.....', '.#######.', '..##....#', '...#....#', '........#', '.......#.', '..#####..'],
  restart: ['..####...', '.#....#.#', '#......##', '#....####', '#........', '#.......#', '.#.....#.', '..#####..'],
  hint: ['..###..', '.#...#.', '#.....#', '#.....#', '.#...#.', '..###..', '.......', '..###..'],
  sound: ['...#.....', '..##..#..', '###.#..#.', '#...#.#.#', '#...#.#.#', '###.#..#.', '..##..#..', '...#.....'],
  muted: ['...#.....', '..##.....', '###.#....', '#...#.#.#', '#...#..#.', '###.#.#.#', '..##.....', '...#.....'],
  next: ['....#..', '....##.', '#######', '....##.', '....#..'],
};
function icon(name) {
  const rows = ICONS[name];
  const d = rows.flatMap((r, y) => [...r].map((c, x) => c === '#' ? `M${x} ${y}h1v1h-1z` : '')).join('');
  return `<svg class="px" viewBox="0 0 ${rows[0].length} ${rows.length}" aria-hidden="true"><path d="${d}"/></svg>`;
}
$('undo').innerHTML = `${icon('undo')}<span>Undo</span><kbd>Z</kbd>`;
$('restart').innerHTML = `${icon('restart')}<span>Restart</span><kbd>R</kbd>`;
$('hintBtn').innerHTML = `${icon('hint')}<span>Hint</span><kbd>H</kbd>`;
$('mute').innerHTML = icon('sound');

const css = [];
const url = k => `url("${ASSETS[k]}") center/contain no-repeat`;
if (ASSETS.villager_blue) css.push(`.cell.B .v, .logo { background: ${url('villager_blue')}; }`);
if (ASSETS.villager_red) css.push(`.cell.r .v { background: ${url('villager_red')}; }`);
if (ASSETS.tile) css.push(`.cell { background: url("${ASSETS.tile}") center/cover; }`);
if (ASSETS.pinned_badge) css.push(`.cell.pinned::after { content: ""; position: absolute; top: 4%; right: 4%; width: 38%; height: 38%; background: ${url('pinned_badge')}; }`);
document.head.insertAdjacentHTML('beforeend', `<style>${css.join('\n')}</style>`);
if (ASSETS.title) $('title').innerHTML = `<img src="${ASSETS.title}" alt="Peer Pressure">`;

let muted = false, music = null;
function sfx(k) { if (!muted && ASSETS[k]) new Audio(ASSETS[k]).play().catch(() => {}); }
// Browsers block audio until the first user gesture.
function startMusic() {
  if (music || !ASSETS.music) return;
  music = new Audio(ASSETS.music);
  music.loop = true;
  music.muted = muted;
  music.play().catch(() => {});
}
addEventListener('pointerdown', startMusic);
addEventListener('keydown', startMusic);
$('mute').onclick = () => {
  muted = !muted;
  if (music) music.muted = muted;
  $('mute').innerHTML = icon(muted ? 'muted' : 'sound');
  $('mute').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
};

let level = 0, history = [], busy = false;
const board = () => history[history.length - 1];
const limit = () => LEVELS[level][1];
const used = () => history.length - 1;
let cells = [];

function load(l) {
  level = l;
  history = [LEVELS[l][0]];
  const n = Math.sqrt(board().length);
  $('board').style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  $('board').innerHTML = '';
  cells = [...board()].map((_, i) => {
    const c = document.createElement('button');
    c.innerHTML = '<i class="v"></i><span class="tie" aria-hidden="true">=</span>';
    c.style.setProperty('--d', `${-((i * 7) % 5) * 0.24}s`); // desync the idle bob so the crowd shuffles
    c.onclick = () => pin(i);
    $('board').append(c);
    return c;
  });
  $('levels').innerHTML = LEVELS.map((_, i) => `<i class="${i < l ? 'done' : i === l ? 'cur' : ''}"></i>`).join('');
  $('levels').setAttribute('aria-label', `Level ${l + 1} of ${LEVELS.length}`);
  $('progress').style.transform = `scaleX(${l / LEVELS.length})`;
  render();
  resetIdle();
}

function paint(i, colour) {
  const n = Math.sqrt(cells.length);
  cells[i].className = 'cell ' + colour;
  cells[i].setAttribute('aria-label', `row ${((i / n) | 0) + 1} column ${i % n + 1}, ${colour === 'B' ? 'blue' : 'red'}`);
}

function counter() {
  $('counter').innerHTML = `<span class="pips">${Array.from({ length: limit() }, (_, t) => `<i class="${t < used() ? 'used' : ''}"></i>`).join('')}</span>
    <span>Turn ${used()}/${limit()}</span>`;
}

function render() {
  const b = board(), ties = tied(b);
  b.split('').forEach((c, i) => {
    paint(i, c);
    cells[i].classList.toggle('tied', ties[i]);
    if (ties[i]) cells[i].setAttribute('aria-label', cells[i].getAttribute('aria-label') + ', tied, keeps colour');
  });
  $('eyebrow').textContent = `Level ${level + 1} of ${LEVELS.length}`;
  $('goal').innerHTML = `Turn everyone <span class="grad">blue</span> <span class="dim">in ${limit()} turns.</span>`;
  counter();
  const won = isWin(b), lost = !won && used() >= limit();
  $('overlay').classList.toggle('show', won || lost);
  $('overlay').classList.toggle('lost', lost);
  $('badge').hidden = !won;
  if (won) {
    const last = level === LEVELS.length - 1;
    $('resultEyebrow').textContent = last ? 'All 6 levels cleared' : `Level ${level + 1} cleared`;
    $('result').innerHTML = `<span class="grad">Everyone's blue!</span>`;
    $('badge').textContent = `Turns ${used()} / par ${limit()}`;
    $('next').innerHTML = `<span>${last ? 'Play again' : 'Next level'}</span>${icon('next')}`;
    $('next').onclick = () => load(last ? 0 : level + 1);
  } else if (lost) {
    $('resultEyebrow').textContent = 'Out of turns';
    $('result').textContent = 'The crowd won.';
    $('next').innerHTML = `${icon('restart')}<span>Try again</span><kbd>R</kbd>`;
    $('next').onclick = restart;
  }
  if (won || lost) $('next').focus();
}

function pin(i) {
  if (busy || isWin(board()) || used() >= limit()) return;
  $('msg').textContent = '';
  const before = board(), after = step(before, i), n = Math.sqrt(before.length);
  history.push(after);
  counter();
  sfx('sfx_pin');
  // Cascade: flips ripple outward from the pinned villager.
  busy = true;
  cells.forEach(c => c.classList.remove('tied', 'hint'));
  cells[i].classList.add('pinned');
  let maxDelay = 0;
  const waves = new Set();
  for (let j = 0; j < after.length; j++) {
    if (after[j] === before[j]) continue;
    const d = Math.abs((j % n) - (i % n)) + Math.abs(((j / n) | 0) - ((i / n) | 0));
    maxDelay = Math.max(maxDelay, d * 120);
    setTimeout(() => { paint(j, after[j]); cells[j].classList.add('hop'); }, d * 120);
    waves.add(d);
  }
  waves.forEach(d => setTimeout(() => sfx('sfx_flip'), d * 120));
  setTimeout(() => {
    busy = false;
    render();
    if (isWin(after)) { sfx('sfx_win'); $('stage').classList.add('shake'); confetti(); }
    else if (used() >= limit()) sfx('sfx_fail');
  }, maxDelay + 400);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colours = ['#2997ff', '#86b6ef', '#ffd60a', '#f5f5f7'];
  for (let k = 0; k < 32; k++) {
    const p = document.createElement('i');
    p.className = 'bit';
    p.style.cssText = `left:${Math.random() * 100}vw;background:${colours[k % 4]};--t:${0.9 + Math.random() * 0.9}s;--dx:${(Math.random() - 0.5) * 160}px;--rot:${Math.random() * 720}deg`;
    document.body.append(p);
    setTimeout(() => p.remove(), 2000);
  }
}

function undo() { if (!busy && history.length > 1) { history.pop(); render(); } }
function restart() { if (!busy) { history = [history[0]]; render(); } }
function hint() {
  if (busy || isWin(board())) return;
  const s = solve(board(), limit() - used());
  if (!s) { $('msg').textContent = 'No win from here. Undo or restart.'; return; }
  cells[s[0]].classList.add('hint');
}

$('stage').addEventListener('animationend', e => e.target === $('stage') && $('stage').classList.remove('shake'));

// Level 1 only: show the hint ring after 8 seconds without input.
let idle;
function resetIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => level === 0 && !busy && hint(), 8000);
}
addEventListener('pointerdown', resetIdle);
addEventListener('keydown', resetIdle);

$('undo').onclick = undo;
$('restart').onclick = restart;
$('hintBtn').onclick = hint;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'z') undo(); else if (k === 'r') restart(); else if (k === 'h') hint();
});

if (location.search.includes('dev')) LEVELS.forEach(([b, t], i) => {
  const s = solve(b, t);
  console.assert(s && s.length === t && !idleWins(b), `level ${i + 1} is broken`);
});
load(0);
</script>
</body>
</html>
