:root {
  /* 16-bit RPG parchment UI over an animated pixel landscape */
  --ink: #2b1d14; --ink-soft: #5e4632; --panel: #fff4d6; --panel-2: #f7e2b0; --hi: #ffffff; --bevel: #dcc08a;
  --blue: #3f7fd9; --blue-dark: #1d3f7a; --blue-hi: #8fbaf5; --red: #c7362f; --gold: #ffcc33; --gold-dark: #b7871b;
  --wood: #b7814a; --wood-hi: #dca267; --wood-dark: #7a4f2a; --soil: #5a3a1e; --grass: #8bd45e;
  --drop: rgba(43, 29, 20, .38);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --pixel: "Press Start 2P", ui-monospace, Menlo, monospace;
  --px: 4px; /* one "pixel" of UI chrome */
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; background: #3fa7e6; color: var(--ink); font: 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; touch-action: manipulation; }
#scene { position: fixed; left: 0; top: 0; z-index: -1; image-rendering: pixelated; pointer-events: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
svg.px { width: 18px; height: 18px; fill: currentColor; shape-rendering: crispEdges; flex: none; }
.eyebrow { margin: 0; font: 10px/1.6 var(--pixel); color: var(--blue-dark); letter-spacing: 1px; text-transform: uppercase; }
.dim { color: var(--ink-soft); }
.blue { color: var(--blue); }

/* pixel-notched outline: 4 offset shadows draw a stepped border; --glow adds bevels and a hard drop shadow */
.pf { --c: var(--ink); margin: var(--px);
  box-shadow: 0 calc(-1 * var(--px)) 0 var(--c), 0 var(--px) 0 var(--c), calc(-1 * var(--px)) 0 0 var(--c), var(--px) 0 0 var(--c), var(--glow, 0 0 0 transparent); }
.panel, .card, .tile, .chip, .menu, .hud, #msg, .icon-btn, .tagline, .select-head { background: var(--panel);
  --glow: inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--bevel), 0 calc(var(--px) + 6px) 0 var(--drop); }

/* HUD */
.progress { position: fixed; inset: 0 0 auto; height: 4px; z-index: 70; background: rgba(43, 29, 20, .35); }
.progress i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: var(--gold); }
.nav { position: fixed; inset: 4px 0 auto; z-index: 60; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 max(10px, 2vw); pointer-events: none; }
.nav > * { pointer-events: auto; }
.nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font: 11px/1 var(--pixel); color: #fff; white-space: nowrap;
  text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink), 2px 2px var(--ink), -2px 2px var(--ink), 2px -2px var(--ink), -2px -2px var(--ink), 0 4px var(--ink); }
.brand img { height: 32px; image-rendering: pixelated; }
.logo { width: 28px; height: 28px; filter: drop-shadow(0 2px 0 var(--ink)); }
body[data-screen="menu"] .brand, body[data-screen="menu"] #back { visibility: hidden; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; cursor: pointer; color: var(--ink); }
.icon-btn:hover, .icon-btn[aria-pressed="true"] { background: var(--panel-2); }
@media (max-width: 420px) { .brand { font-size: 0; gap: 0; } } /* phones: logo sprite only */

/* sprites: kind class + colour class. Fallback when an ASSETS entry is empty: plain coloured squares. */
.spr, .v { display: block; image-rendering: pixelated; }
.B > .v, .spr.B { background: var(--blue); }
.r > .v, .spr.r { background: var(--red); }
.k-t > .v, .spr.k-t { background: #2f7d4f; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 16px; border: 0; cursor: pointer;
  font: 10px/1.3 var(--pixel); letter-spacing: .5px; text-transform: uppercase; color: var(--ink); background: var(--panel);
  --glow: inset 3px 3px 0 var(--hi), inset -3px -4px 0 var(--bevel), 0 calc(var(--px) + 5px) 0 var(--drop); }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(4px); --glow: inset 3px 3px 0 var(--hi), inset -3px -4px 0 var(--bevel); }
.btn.primary { color: #fff; background: var(--blue); text-shadow: 0 2px 0 var(--blue-dark);
  --glow: inset 3px 3px 0 var(--blue-hi), inset -3px -4px 0 var(--blue-dark), 0 calc(var(--px) + 5px) 0 var(--drop); }
.btn.primary:hover { background: #4b8ae3; }
.btn.primary:active { --glow: inset 3px 3px 0 var(--blue-hi), inset -3px -4px 0 var(--blue-dark); }
kbd { font: 9px/1 var(--pixel); padding: 4px 5px 3px; color: var(--panel); background: var(--ink); text-shadow: none; }
.btn.primary kbd { color: #fff; background: var(--blue-dark); }
@media (hover: none) { kbd { display: none; } }
.stars { display: inline-flex; gap: 3px; }
.stars svg { width: 14px; height: 14px; color: var(--bevel); }
.stars svg.on { color: var(--gold); filter: drop-shadow(1px 1px 0 var(--gold-dark)); }

/* screens */
.screen { display: none; flex-direction: column; align-items: center; }
body[data-screen="menu"] #menu, body[data-screen="select"] #select, body[data-screen="game"] #game { display: flex; }

/* title screen */
#menu { gap: 22px; padding: 72px 16px 48px; text-align: center; }
.logo-title { display: grid; gap: 10px; margin: 8px 0 0; font: clamp(30px, 9.5vw, 76px)/1 var(--pixel); color: #fff; letter-spacing: -1px;
  text-shadow: 4px 0 var(--ink), -4px 0 var(--ink), 0 4px var(--ink), 0 -4px var(--ink), 4px 4px var(--ink), -4px 4px var(--ink), 4px -4px var(--ink), -4px -4px var(--ink),
    0 10px var(--ink), 4px 10px var(--ink), -4px 10px var(--ink); }
.logo-title .blue { color: #6fb0ff; }
.logo-title span { animation: float 2.4s steps(2) infinite; }
.logo-title span + span { animation-delay: -1.2s; }
@keyframes float { 50% { transform: translateY(-4px); } }
.tagline { margin: 0; max-width: 34ch; padding: 14px 16px; font: 10px/1.8 var(--pixel); }
#crowd { display: flex; gap: clamp(2px, 1vw, 8px); justify-content: center; }
#crowd .spr { width: clamp(24px, 7vw, 52px); aspect-ratio: 1; filter: drop-shadow(0 3px 0 rgba(43, 29, 20, .35)); }
.menu { display: grid; gap: 4px; width: min(100%, 360px); padding: 12px; }
.item { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px 0 30px; border: 0; background: transparent; cursor: pointer;
  font: 11px/1.3 var(--pixel); text-transform: uppercase; color: var(--ink); text-align: left; }
.item small { margin-left: auto; font: 9px/1 var(--pixel); color: var(--ink-soft); text-transform: none; }
.item .cur { position: absolute; left: 8px; visibility: hidden; color: var(--red); animation: blink .7s steps(2) infinite; }
.item:hover, .item:focus-visible { background: var(--panel-2); outline: none; }
.item:hover .cur, .item:focus-visible .cur { visibility: visible; }
.item.main { color: var(--blue-dark); }
.footer-note { margin: 0; font: 9px/1.8 var(--pixel); color: #fff; text-shadow: 0 2px 0 var(--ink); }

/* level select */
#select { gap: 28px; padding: 80px 16px 48px; }
.select-head { display: grid; gap: 10px; justify-items: center; padding: 16px 20px; text-align: center; }
.select-head h2 { margin: 0; font: 14px/1.4 var(--pixel); }
#chapters { width: 100%; display: grid; gap: 30px; justify-items: center; }
.chapter { width: min(100%, 760px); }
.chapter h3 { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 8px 14px 8px 10px; font: 10px/1 var(--pixel); text-transform: uppercase; letter-spacing: 1px;
  color: #fff; background: var(--blue-dark); --c: var(--ink); --glow: inset 3px 3px 0 var(--blue), 0 calc(var(--px) + 4px) 0 var(--drop); }
.chapter h3 .spr { width: 28px; height: 28px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
.tile { display: grid; gap: 8px; align-content: start; justify-items: start; padding: 14px; min-height: 100px; border: 0; cursor: pointer; text-align: left; }
.tile b { font: 16px/1 var(--pixel); color: var(--blue-dark); }
.tile .nm { font: 9px/1.5 var(--pixel); color: var(--ink); }
.tile:hover { background: var(--panel-2); }
.tile:disabled { cursor: not-allowed; background: #d9cfb8; color: var(--ink-soft); --glow: inset 3px 3px 0 #ece4d2, inset -3px -3px 0 #b8ab8e, 0 calc(var(--px) + 6px) 0 var(--drop); }
.tile:disabled b { color: var(--ink-soft); }

/* game */
#game { gap: 16px; padding: 74px 12px 32px; }
.hud { display: grid; gap: 10px; justify-items: center; width: min(100%, 520px); padding: 14px 12px 12px; text-align: center; }
#goal { margin: 0; font: clamp(9px, 2.85vw, 15px)/1.3 var(--pixel); white-space: nowrap; }

.pips { display: flex; gap: 5px; }

.pips i.used { background: var(--bevel); box-shadow: 0 0 0 2px var(--ink), inset -3px -3px 0 #c4a66e; }
#goals { display: flex; gap: 6px; }
#goals span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px 4px; font: 8px/1 var(--pixel); background: var(--panel-2); box-shadow: 0 0 0 2px var(--ink); }
#goals span svg { width: 10px; height: 10px; color: var(--gold-dark); }
#goals span.off { opacity: .45; text-decoration: line-through; }

/* the board: a wooden garden plot */
.frame { position: relative; padding: 10px; background: var(--wood); width: min(calc(100% - 8px), 440px, max(260px, calc(100svh - 400px)));

#board { display: grid; gap: 4px; padding: 4px; background: var(--soil); }
.cell { position: relative; aspect-ratio: 1; min-width: 0; min-height: 0; border: 0; padding: 10%; background: var(--grass); cursor: pointer; image-rendering: pixelated; }
.cell:not(:disabled):hover { filter: brightness(1.12); }
.cell:disabled { cursor: default; }
.cell:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.v { width: 100%; height: 100%; animation: bob 1.2s steps(2) infinite; animation-delay: var(--d, 0s); filter: drop-shadow(0 2px 0 rgba(43, 29, 20, .3)); }
.k-t > .v, .k-s > .v { animation: none; }
@keyframes bob { 50% { transform: translateY(-6.25%); } } /* one sprite pixel */
.cell.hop > .v { animation: hop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hop { 0% { transform: none; } 40% { transform: translateY(-26%) scale(1.06, .94); } 75% { transform: scale(1.12, .86); } 100% { transform: none; } }
.cell .tie { position: absolute; right: 3px; bottom: 3px; display: none; min-width: 18px; padding: 3px 2px 2px; text-align: center;
  font: 9px/1 var(--pixel); color: var(--ink); background: var(--gold); box-shadow: 0 0 0 2px var(--ink); }
.cell.tied .tie { display: block; }
/* preview: who flips if you pin here (mini sprite of their next look) */
.cell .nx { position: absolute; left: 4%; top: 4%; z-index: 2; display: none; width: 38%; height: 38%; padding: 2px; background: var(--panel); box-shadow: 0 0 0 2px var(--ink); }
.nx > .spr { width: 100%; height: 100%; }
.cell.pv .nx { display: block; }
.cell.pv > .v { opacity: .45; }
.cell.armed { box-shadow: inset 0 0 0 4px var(--blue-dark); }
.cell.pinned { box-shadow: inset 0 0 0 4px var(--gold); }
.cell.pinned > .v { animation: none; }
.cell.hint::before { content: ""; position: absolute; inset: -5px; z-index: 1; pointer-events: none; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--ink); animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.bubble { position: absolute; bottom: 92%; left: 50%; z-index: 6; width: max-content; max-width: 160px; padding: 7px 8px 6px; pointer-events: none;
  font: 8px/1.6 var(--pixel); color: var(--ink); background: #fff; --glow: 0 0 0 transparent; transform: translateX(-50%); animation: bubble 1.8s steps(6) forwards; }
.bubble.l { left: 0; transform: none; } .bubble.rt { left: auto; right: 0; transform: none; }
@keyframes bubble { 0% { opacity: 0; } 8%, 88% { opacity: 1; } 100% { opacity: 0; } }

#legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 8px; border: 0; cursor: pointer; font: 8px/1 var(--pixel); color: var(--ink); }
.chip .spr { width: 26px; height: 26px; }
.chip:hover { background: var(--panel-2); }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
#msg { margin: 0; padding: 10px 14px; font: 9px/1.6 var(--pixel); text-align: center; }
#msg:empty { display: none; }
/* phones: icon-only legend so a busy level still fits one row (names stay in aria-label) */
@media (max-width: 520px) {
  #legend { gap: 4px; } .chip { min-width: 44px; justify-content: center; padding: 0 6px; } .chip span { display: none; } .chip .spr { width: 24px; height: 24px; }
  .controls { gap: 8px; } .controls .btn { padding: 0 9px; gap: 6px; } .controls kbd { display: none; }
}

/* overlays: stage clear / out of turns / villager cards */
.overlay { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(26, 16, 40, .45); }
.overlay.show { display: flex; }
#overlay.lost { background: rgba(26, 16, 40, .2); align-items: flex-end; } /* keep the near-miss visible */
.card { width: min(100%, 440px); max-height: calc(100svh - 32px); overflow-y: auto; padding: 26px 20px 22px; text-align: center; display: grid; gap: 14px; justify-items: center;
  animation: rise .25s steps(4); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.card h2 { margin: 0; font: clamp(16px, 5vw, 24px)/1.3 var(--pixel); color: var(--ink); }
.card h2 .win { color: var(--blue); text-shadow: 0 3px 0 var(--blue-dark); }
.card p { margin: 0; color: var(--ink); }
#overlay.lost .eyebrow { color: var(--red); }
.bigstars { display: flex; gap: 12px; }
.bigstars svg { width: 44px; height: 44px; color: var(--bevel); }
.bigstars svg.on { color: var(--gold); filter: drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink));
  animation: starpop .4s steps(4) both; animation-delay: calc(var(--i) * .28s + .2s); }
@keyframes starpop { from { transform: scale(0); } }
#result-note { font: 9px/1.7 var(--pixel); color: var(--ink-soft); }
.actions { display: grid; gap: 14px; width: min(100%, 300px); margin-top: 6px; }
#share-text { width: 100%; min-height: 120px; font: 14px/1.3 ui-monospace, Menlo, monospace; color: var(--ink); background: #fff; border: 3px solid var(--ink); padding: 8px; }
.modal-spr { width: 96px; height: 96px; filter: drop-shadow(0 4px 0 rgba(43, 29, 20, .3)); }
.rules { display: grid; gap: 12px; width: 100%; text-align: left; }
.rules ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
.rules .spr { width: 40px; height: 40px; }
.rules p { font-size: 15px; line-height: 1.45; }

/* screen shake + pixel confetti on win */
.shake { animation: shake .4s steps(5); }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } }

<script id="rules">
// Board: string of colours, row-major, square: 'B' blue, 'r' red, '-' nobody (tree).
// Types (optional, same length, '' = all plain villagers):
//   '.' villager  copies the majority of its up/down/left/right neighbours; a tie keeps its colour
//   'X' rebel     does the opposite of the majority
//   'L' loudmouth its vote counts double for its neighbours
//   'G' gossip    also listens to its 4 diagonal neighbours
//   'S' statue    never changes, still votes, does not need to turn blue
//   'T' tree      nobody lives here: no vote, no colour
// pin: cell index, or -1 for none. A pinned villager keeps its colour for that turn only.
const ORTHO = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const ALL8 = [...ORTHO, [-1, -1], [1, -1], [-1, 1], [1, 1]];
const fixed = (types, i) => types[i] === 'S' || types[i] === 'T';

// Weighted [blue, red] votes reaching cell i.
function votes(board, i, types = '') {
  const n = Math.sqrt(board.length), x = i % n, y = (i - x) / n;
  let b = 0, r = 0;
  for (const [dx, dy] of types[i] === 'G' ? ALL8 : ORTHO) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
    const j = ny * n + nx, w = types[j] === 'L' ? 2 : 1;
    if (board[j] === 'B') b += w; else if (board[j] === 'r') r += w;
  }
  return [b, r];
}

function step(board, pin, types = '') {
  let out = '';
  for (let i = 0; i < board.length; i++) {
    if (i === pin || fixed(types, i)) { out += board[i]; continue; }
    const [b, r] = votes(board, i, types);
    if (b === r) { out += board[i]; continue; }
    const majority = b > r ? 'B' : 'r';
    out += types[i] === 'X' ? (majority === 'B' ? 'r' : 'B') : majority;
  }
  return out;
}

// Won when every villager who can change is blue (statues and trees don't count).
const isWin = (board, types = '') => [...board].every((c, i) => c !== 'r' || types[i] === 'S');

// Villagers whose votes are split evenly (they keep their colour next turn).
const tied = (board, types = '') => [...board].map((_, i) => {
  if (fixed(types, i)) return false;
  const [b, r] = votes(board, i, types);
  return b === r;
});

// BFS: shortest list of pins that wins within `turns`, or null.
function solve(board, turns, types = '') {
  if (isWin(board, types)) return [];
  const pins = [...board].map((_, i) => i).filter(i => !fixed(types, i));
  let layer = new Map([[board, []]]);
  const seen = new Set([board]);
  for (let t = 0; t < turns; t++) {
    const next = new Map();
    for (const [b, path] of layer) {
      for (const p of pins) {
        const nb = step(b, p, types);
        if (isWin(nb, types)) return [...path, p];
        if (!seen.has(nb)) { seen.add(nb); next.set(nb, [...path, p]); }
      }
    }
    layer = next;
  }
  return null;
}

// Run with no pins until the board repeats; true if it ever wins.
function idleWins(board, types = '') {
  const seen = new Set();
  while (!seen.has(board)) {
    if (isWin(board, types)) return true;
    seen.add(board);
    board = step(board, -1, types);
  }
  return false;
}

// Seeded RNG (mulberry32), so a daily village is the same on every device.
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Random village for spec { n, kinds: { X: 2, T: 1, ... } }.
function randomLevel(spec, rand) {
  const types = Array(spec.n * spec.n).fill('.'), free = [...types.keys()];
  for (const [k, count] of Object.entries(spec.kinds || {}))
    for (let c = 0; c < count; c++) types[free.splice(Math.floor(rand() * free.length), 1)[0]] = k;
  return { types: types.join(''), board: types.map(t => (t === 'T' ? '-' : rand() < 0.5 ? 'B' : 'r')).join('') };
}

// A village where doing nothing never wins and the shortest win is exactly spec.par turns
// (or anywhere from spec.minPar to spec.par, which is much faster to find).
function generate(spec, rand, tries = 500) {
  for (let t = 0; t < tries; t++) {
    const { types, board } = randomLevel(spec, rand);
    if (isWin(board, types) || idleWins(board, types)) continue;
    const s = solve(board, spec.par, types); // BFS, so s is a shortest win
    if (s && s.length >= (spec.minPar || spec.par)) return { types, board, par: s.length };
  }
  return null;
}

$('restart').innerHTML = `${icon('restart')}<span>Restart</span><kbd>R</kbd>`;
$('hintBtn').innerHTML = `${icon('hint')}<span>Hint</span><kbd>H</kbd>`;

// ---------- sound ----------
let muted = false, music = null;
function sfx(k) { if (!muted && ASSETS[k]) new Audio(ASSETS[k]).play().catch(() => {}); }
// Browsers block audio until the first user gesture.
function startMusic() {
  if (music || !ASSETS.music) return;
  music = new Audio(ASSETS.music);
  music.loop = true;
  music.muted = muted;
  music.play().catch(() => {});
}
addEventListener('pointerdown', startMusic);
addEventListener('keydown', startMusic);
$('mute').onclick = () => {
  muted = !muted;
  if (music) music.muted = muted;
  $('mute').innerHTML = icon(muted ? 'muted' : 'sound');
  $('mute').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
};

// ---------- progress (per browser) ----------
let save = { stars: [], daily: {}, best: 0, seen: [] };
try { Object.assign(save, JSON.parse(localStorage.getItem('peer-pressure')) || {}); } catch {}
const persist = () => { try { localStorage.setItem('peer-pressure', JSON.stringify(save)); } catch {} };
const totalStars = () => save.stars.reduce((a, s) => a + (s || 0), 0);
const unlocked = i => i === 0 || save.stars[i - 1] > 0;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---------- scenery: a pixel village panorama on a low-res canvas, scaled up with hard pixels ----------
// Each layer is pre-drawn once per palette/resize as a seamless strip, then scrolled at its own speed.
const SCENES = {
  day: { sky: ['#3fa7e6', '#5bb9ec', '#7ccaf0', '#a2daf3', '#c9ebf6'], sun: '#fff7c2', ring: '#ffe27a', sunY: 0.2, cloud: '#ffffff', cloudShade: '#d3ecf7',
    far: '#a6c8ea', farShade: '#8fb4dc', snow: '#f5fbff', hill: '#79c95b', hillShade: '#68b84c', hillDark: '#3f8a36',
    wall: '#f6e7c8', wallShade: '#d8bf8f', roofs: ['#d9573f', '#3f7fd9', '#e0a03a', '#8a5ad9'], window: '#4a3524', door: '#7a4e2d',
    tree: '#46a24b', treeShade: '#2f7d38', trunk: '#6b4a2b', ground: '#8bd45e', groundShade: '#76c24c', tuft: '#5aa837',
    path: '#e8cc92', pathShade: '#cfa96c', flowers: ['#ff5e7e', '#fff27a', '#ffffff', '#b07cff'], smoke: '#f4f4f4', bird: '#2c3550' },
  sunset: { sky: ['#4a2f78', '#8a3f86', '#d45d7e', '#f58b6a', '#ffc07a'], sun: '#fff1b0', ring: '#ffb35c', sunY: 0.62, cloud: '#ffb59a', cloudShade: '#d47a8a',
    far: '#8a5a9a', farShade: '#734a86', snow: '#f7c7c7', hill: '#6c8a46', hillShade: '#5f7c3e', hillDark: '#445c2f',
    wall: '#e9c9a6', wallShade: '#c39a78', roofs: ['#b8433a', '#3c5fa8', '#c9822e', '#6a4aa8'], window: '#ffcf5a', door: '#5a3a22',
    tree: '#4f7a3c', treeShade: '#3a5e2e', trunk: '#4f3520', ground: '#7aa04a', groundShade: '#6c913f', tuft: '#4e7330',
    path: '#d6a878', pathShade: '#b48558', flowers: ['#ff7e9e', '#ffe27a', '#ffffff', '#c09cff'], smoke: '#e8c6c0', bird: '#2a1a35' },
  night: { sky: ['#070b24', '#0d1438', '#16204c', '#22305f', '#2f4072'], sun: '#f2efd2', ring: '#3a4a80', sunY: 0.2, moon: true, stars: true, cloud: '#2f3b6e', cloudShade: '#253060',
    far: '#26305c', farShade: '#1d2650', snow: '#9aa6d6', hill: '#1f4a3a', hillShade: '#1a4033', hillDark: '#112c23',
    wall: '#5a5878', wallShade: '#46445f', roofs: ['#6a2f3a', '#2a3f7a', '#6a4a24', '#4a2f6a'], window: '#ffd84d', door: '#2a2232',
    tree: '#1d4a34', treeShade: '#143726', trunk: '#2e2418', ground: '#2d5a3c', groundShade: '#285236', tuft: '#1a3d27',
    path: '#6a6080', pathShade: '#544c68', flowers: ['#ff8fb0', '#fff3a0', '#ffffff', '#c9a0ff'], smoke: '#7a80a8', bird: null, fireflies: '#fff27a' },
  dawn: { sky: ['#5d79c9', '#8f8fd6', '#c9a0d0', '#f2b9c0', '#ffdcb8'], sun: '#fffbe0', ring: '#ffd1a0', sunY: 0.5, cloud: '#fff0f0', cloudShade: '#e3c3d6',
    far: '#a39bd0', farShade: '#8c84bf', snow: '#ffffff', hill: '#86bd6a', hillShade: '#78ae5e', hillDark: '#578c45',
    wall: '#f3e1cf', wallShade: '#d2b8a0', roofs: ['#d9573f', '#3f7fd9', '#e0a03a', '#8a5ad9'], window: '#ffd98a', door: '#6b4a2b',
    tree: '#56a058', treeShade: '#3f8446', trunk: '#6b4a2b', ground: '#97cf72', groundShade: '#87c062', tuft: '#64a447',
    path: '#ecd2a8', pathShade: '#d0b080', flowers: ['#ff5e7e', '#fff27a', '#ffffff', '#b07cff'], smoke: '#ffffff', bird: '#4a3a5a' },
};
const CHAPTER_SCENE = { 'Hat Trick': 'day', 'Into the Woods': 'day', 'Stone Cold': 'sunset', Rebels: 'sunset', Loudmouths: 'night', Gossips: 'night', Finale: 'dawn' };
const scene = { name: '', W: 0, H: 0, L: null, raf: 0, last: 0, still: !!save.still };
const sceneCtx = $('scene').getContext('2d');
const mod = (a, n) => ((a % n) + n) % n;

function strip(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function rect(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function disc(g, col, cx, cy, r) {
  for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy)); rect(g, col, cx - h, cy + dy, 2 * h + 1, 1); }
}

function buildScene() {
  const pal = SCENES[scene.name], P = innerWidth < 600 ? 3 : 4;
  const W = Math.ceil(innerWidth / P), H = Math.ceil(innerHeight / P), yG = H - Math.max(26, Math.round(H * 0.16));
  Object.assign(scene, { W, H });
  const cv = $('scene');
  cv.width = W; cv.height = H; cv.style.width = W * P + 'px'; cv.style.height = H * P + 'px';
  document.body.style.backgroundColor = pal.sky[0];
  const rand = rng(11), L = { pal, yG };

  // sky bands with a dithered seam, then the sun or moon
  const [sky, s] = strip(W, H), bh = Math.ceil(yG / pal.sky.length);
  pal.sky.forEach((col, b) => {
    rect(s, col, 0, b * bh, W, b === pal.sky.length - 1 ? H : bh);
    if (b) for (let x = 0; x < W; x += 2) rect(s, pal.sky[b - 1], x, b * bh), rect(s, pal.sky[b - 1], x + 1, b * bh + 2);
  });
  const sx = Math.round(W * 0.76), sy = Math.round(yG * pal.sunY), r = Math.max(6, Math.round(Math.min(W, H) * 0.05));
  for (let dy = -r - 3; dy <= r + 3; dy++) for (let dx = -r - 3; dx <= r + 3; dx++) {
    const d = dx * dx + dy * dy;
    if (d > r * r && d <= (r + 3) * (r + 3) && (dx + dy) % 2 === 0) rect(s, pal.ring, sx + dx, sy + dy);
  }
  disc(s, pal.sun, sx, sy, r);
  if (pal.moon) [[-2, -2], [2, 1], [-1, 3]].forEach(([dx, dy]) => rect(s, '#d6d2b0', sx + dx, sy + dy, 2, 2));
  L.sky = sky;
  L.stars = pal.stars ? Array.from({ length: Math.round((W * yG) / 260) }, () => [Math.floor(rand() * W), Math.floor(rand() * yG * 0.75), rand() * 6]) : [];

  // clouds: overlapping puffs, shade first, then the lit puffs shifted up 2px
  L.clouds = Array.from({ length: Math.max(4, Math.round(W / 45)) }, () => {
    const w = 18 + Math.floor(rand() * 22), h = Math.ceil(w * 0.45), [c, g] = strip(w, h + 2);
    const puffs = Array.from({ length: 3 + Math.floor(rand() * 3) }, () => {
      const pr = Math.max(3, Math.round(h * (0.35 + rand() * 0.3)));
      return [Math.round(pr + rand() * (w - 2 * pr)), h + 1 - pr, pr];
    });
    puffs.forEach(([x, y, pr]) => disc(g, pal.cloudShade, x, y, pr));
    puffs.forEach(([x, y, pr]) => disc(g, pal.cloud, x, y - 2, pr));
    return { img: c, x: rand() * W, y: Math.floor(rand() * yG * 0.42), v: 1.5 + rand() * 3 };
  });

  // far mountains: wrap-around peaks so the strip tiles seamlessly
  const TW = 256, yM = yG - Math.round(H * 0.05), [far, f] = strip(TW, H);
  const peaks = Array.from({ length: 6 }, (_, i) => ({ x: i * (TW / 6) + rand() * 20, h: H * (0.12 + rand() * 0.16), k: 0.8 + rand() * 0.5 }));
  for (let x = 0; x < TW; x++) {
    let top = H, side = 0;
    for (const p of peaks) {
      const dx = mod(x - p.x + TW / 2, TW) - TW / 2, y = yM - p.h + Math.abs(dx) * p.k;
      if (y < top) { top = y; side = dx; }
    }
    top = Math.round(top);
    rect(f, side > 0 ? pal.farShade : pal.far, x, top, 1, yG - top);
    if (yM - top > H * 0.17) rect(f, pal.snow, x, top, 1, 2 + (x % 3 === 0));
  }
  L.far = far;

  // rolling hills with little trees on the ridge
  const HW = 200, [hills, hg] = strip(HW, H), ridge = [];
  for (let x = 0; x < HW; x++) {
    const top = Math.round(yG - H * 0.065 - H * 0.03 * Math.sin((2 * Math.PI * 2 * x) / HW + 1) - H * 0.018 * Math.sin((2 * Math.PI * 3 * x) / HW + 2));
    ridge.push(top);
    rect(hg, pal.hill, x, top, 1, yG - top);
    for (let y = top + 5; y < yG; y += 2) rect(hg, pal.hillShade, x, y + (x % 2));
  }
  for (let x = 6; x < HW - 6; x += 12 + Math.floor(rand() * 14)) {
    rect(hg, pal.trunk, x, ridge[x] - 2, 1, 2);
    rect(hg, pal.hillDark, x - 1, ridge[x] - 5, 3, 3);
    rect(hg, pal.hillDark, x, ridge[x] - 6, 1, 1);
  }
  L.hills = hills;

  // the village: houses with chimneys (smoke is drawn per frame) and trees
  const VW = 220, [vil, v] = strip(VW, H);
  L.chimneys = [];
  for (let x = 4; x < VW - 24;) {
    if (rand() < 0.62) {
      const w = 13 + 2 * Math.floor(rand() * 3), wh = 8 + Math.floor(rand() * 4), roof = pal.roofs[Math.floor(rand() * pal.roofs.length)];
      rect(v, pal.wall, x, yG - wh, w, wh);
      rect(v, pal.wallShade, x + w - 2, yG - wh, 2, wh);
      let rows = 0;
      for (let r = 0; w + 2 - 2 * r >= 3; r++, rows++) rect(v, roof, x - 1 + r, yG - wh - 1 - r, w + 2 - 2 * r, 1);
      rect(v, 'rgba(0,0,0,.18)', x - 1, yG - wh - 1, w + 2, 1);
      const cx = x + w - 5, ctop = yG - wh - 1 - Math.min(cx - x + 1, x + w - cx) - 2;
      rect(v, pal.wallShade, cx, ctop, 2, 4);
      L.chimneys.push([cx, ctop, rand() * 9]);
      rect(v, pal.door, x + Math.floor(w / 2) - 1, yG - 5, 3, 5);
      rect(v, pal.window, x + 2, yG - wh + 3, 2, 2);
      rect(v, pal.window, x + w - 6, yG - wh + 3, 2, 2);
      x += w + 3 + Math.floor(rand() * 5);
    } else {
      const r = 3 + Math.floor(rand() * 2);
      rect(v, pal.trunk, x + r - 1, yG - 3, 2, 3);
      disc(v, pal.treeShade, x + r + 1, yG - 3 - r + 1, r);
      disc(v, pal.tree, x + r, yG - 3 - r, r);
      x += 2 * r + 3 + Math.floor(rand() * 4);
    }
  }
  L.village = vil;

  // foreground: grass, a dirt path and flowers; two frames so the tufts sway
  const FW = 160, py = yG + Math.round((H - yG) * 0.42), ph = Math.max(4, Math.round((H - yG) * 0.3));
  L.pathY = py + Math.floor(ph / 2);
  L.fg = [0, 1].map(sway => {
    const fr = rng(5), [fgc, g] = strip(FW, H);
    rect(g, pal.ground, 0, yG, FW, H - yG);
    rect(g, pal.path, 0, py, FW, ph);
    for (let x = 0; x < FW; x += 2) rect(g, pal.ground, x, py), rect(g, pal.ground, x + 1, py + ph - 1);
    for (let k = 0; k < FW / 3; k++) rect(g, pal.pathShade, Math.floor(fr() * FW), py + 1 + Math.floor(fr() * (ph - 2)));
    for (let k = 0; k < FW / 2; k++) {
      const x = Math.floor(fr() * FW), y = yG + Math.floor(fr() * (H - yG));
      if (y < py - 1 || y > py + ph) rect(g, pal.groundShade, x, y, 2, 1);
    }
    for (let k = 0; k < FW / 4; k++) { // tufts poking above the ground line
      const x = Math.floor(fr() * FW);
      rect(g, pal.tuft, x, yG - 1);
      rect(g, pal.tuft, x + (sway ? 1 : -1) * (k % 2), yG - 2);
    }
    for (let k = 0; k < FW / 10; k++) {
      const x = Math.floor(fr() * FW), y = fr() < 0.5 ? yG + 2 + Math.floor(fr() * Math.max(1, py - yG - 4)) : py + ph + 1 + Math.floor(fr() * Math.max(1, H - py - ph - 2));
      rect(g, pal.tuft, x + sway * (k % 2), y + 1);
      rect(g, pal.flowers[k % pal.flowers.length], x, y);
    }
    return fgc;
  });

  // tiny villagers walking the path
  L.walkers = Array.from({ length: Math.max(4, Math.round(W / 50)) }, (_, i) => ({ x: rand() * W, v: (rand() < 0.5 ? -1 : 1) * (5 + rand() * 5), hat: i % 2 ? '#d9473f' : '#3f7fd9' }));
  L.fireflies = pal.fireflies ? Array.from({ length: 16 }, () => [rand() * W, yG - 4 - rand() * 22, rand() * 6]) : [];
  scene.L = L;
}

function drawScene(now) {
  const { W, H, L } = scene, g = sceneCtx, pal = L.pal, t = now / 1000, yG = L.yG;
  const scroll = (img, off) => { const o = Math.floor(mod(off, img.width)); for (let x = -o; x < W; x += img.width) g.drawImage(img, x, 0); };
  g.drawImage(L.sky, 0, 0);
  for (const [x, y, ph] of L.stars) if (Math.sin(t * 1.7 + ph * 3) > -0.4) rect(g, Math.sin(t * 2.3 + ph) > 0.6 ? '#ffffff' : '#9aa6d6', x, y);
  for (const c of L.clouds) g.drawImage(c.img, Math.floor(mod(c.x + c.v * t, W + c.img.width)) - c.img.width, c.y);
  scroll(L.far, 1.5 * t);
  scroll(L.hills, 4 * t);
  scroll(L.village, 8 * t);
  const vo = mod(8 * t, L.village.width);
  for (const [cx, cy, seed] of L.chimneys) for (let k = 0; k < 4; k++) {
    const age = mod(t * 0.45 + k / 4 + seed, 1), sx = cx - vo + Math.round(Math.sin(age * 6 + seed) * 1.5 + age * 4);
    for (let x = sx; x < W + 4; x += L.village.width) if (x > -4) rect(g, pal.smoke, x, Math.round(cy - 1 - age * 14), age < 0.45 ? 1 : 2, age < 0.45 ? 1 : 2);
  }
  if (pal.bird) for (let i = 0; i < 3; i++) {
    const bx = Math.floor(mod(t * (7 + i * 2) + i * 70, W + 30)) - 15, by = Math.round(yG * 0.28 + i * 7 + Math.sin(t * 2 + i) * 2);
    if (Math.floor(t * 5 + i) % 2) [[0, 0], [1, 1], [3, 1], [4, 0], [2, 2]].forEach(([dx, dy]) => rect(g, pal.bird, bx + dx, by + dy));
    else [[0, 1], [1, 1], [3, 1], [4, 1], [2, 2]].forEach(([dx, dy]) => rect(g, pal.bird, bx + dx, by + dy));
  }
  for (const [x, y, ph] of L.fireflies) if (Math.sin(t * 2.5 + ph * 7) > 0.35) rect(g, pal.fireflies, Math.floor(mod(x + Math.sin(t * 0.6 + ph) * 6, W)), Math.round(y + Math.sin(t + ph) * 2));
  scroll(L.fg[Math.floor(t * 1.5) % 2], 14 * t);
  L.walkers.forEach((w, i) => {
    const x = Math.floor(mod(w.x + (w.v - 14) * t, W + 12)) - 6, y = L.pathY - 7, step = Math.floor(t * 6 + i) % 2;
    rect(g, w.hat, x + 1, y, 3, 1); rect(g, w.hat, x, y + 1, 5, 1);
    rect(g, '#f6c89f', x + 1, y + 2, 3, 2); rect(g, '#2b1d14', x + (w.v > 0 ? 3 : 1), y + 2);
    rect(g, '#eceaf5', x + 1, y + 4, 3, 2);
    if (step) rect(g, '#2b1d14', x + 1, y + 6, 1, 2), rect(g, '#2b1d14', x + 3, y + 6, 1, 2);
    else rect(g, '#2b1d14', x + 2, y + 6, 1, 2);
  });
}

function loop(now) {
  scene.raf = requestAnimationFrame(loop);
  if (now - scene.last < 33) return; // ~30 fps is plenty for pixel art
  scene.last = now;
  drawScene(now);
}
function sceneMotion() {
  cancelAnimationFrame(scene.raf);
  drawScene(performance.now());
  if (!reduced() && !scene.still) scene.raf = requestAnimationFrame(loop);
  $('motion').setAttribute('aria-pressed', String(scene.still || reduced()));
  $('motion').innerHTML = icon(scene.still || reduced() ? 'resume' : 'pause');
}
function setScene(name) {
  if (name === scene.name) return;
  scene.name = name;
  buildScene();
  sceneMotion();
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { buildScene(); drawScene(performance.now()); }, 150); });
$('motion').onclick = () => { scene.still = save.still = !scene.still; persist(); sceneMotion(); };

// ---------- screens ----------
function show(screen) {
  document.body.dataset.screen = screen;
  if (screen !== 'game') { setScene('day'); replaying = false; $('overlay').classList.remove('show'); }
  $('progress').style.transform = `scaleX(${totalStars() / (LEVELS.length * 3)})`;
  clearTimeout(idle);
  if (screen === 'menu') renderMenu();
  if (screen === 'select') renderSelect();
  scrollTo(0, 0);
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderMenu() {
  const d = save.daily[today()];
  const cur = `<span class="cur">${icon('next')}</span>`;
  $('play-btn').innerHTML = `${cur}<span>${totalStars() ? 'Continue' : 'Start game'}</span><small>${icon('star')} ${totalStars()}/${LEVELS.length * 3}</small>`;
  $('daily-btn').innerHTML = `${cur}<span>Daily village</span><small>${d ? `${d}/3 stars` : today().slice(5)}</small>`;
  $('endless-btn').innerHTML = `${cur}<span>Endless</span><small>best ${save.best}</small>`;
  $('howto-btn').innerHTML = `${cur}<span>How to play</span>`;
  $('play-btn').onclick = () => (totalStars() ? show('select') : playCampaign(0)); // first visit: straight into level 1
}

// The menu crowd does the wave: everyone flips colour, one after another.
const CROWD = '.X.L.G.S.X.G';
$('crowd').innerHTML = [...CROWD].map((k, i) => `<i class="${sprClass(k, i % 3 ? 'r' : 'B')}"></i>`).join('');
let waveBlue = true;
setInterval(() => {
  if (document.body.dataset.screen !== 'menu' || reduced()) return;
  [...$('crowd').children].forEach((el, i) => setTimeout(() => {
    el.classList.remove('B', 'r');
    el.classList.add(waveBlue ? 'B' : 'r');
    el.animate([{ transform: 'none' }, { transform: 'translateY(-30%)' }, { transform: 'none' }], { duration: 320 });
  }, i * 90));
  waveBlue = !waveBlue;
}, 2600);

function renderSelect() {
  $('total-stars').innerHTML = `${icon('star', 'on')}&nbsp;<span class="eyebrow">${totalStars()} / ${LEVELS.length * 3}</span>`;
  const chapters = [...new Set(LEVELS.map(l => l[0]))];
  const seenKinds = new Set();
  $('chapters').innerHTML = chapters.map(ch => {
    const entries = LEVELS.map((l, i) => [l, i]).filter(([l]) => l[0] === ch);
    const kinds = [...new Set(entries.flatMap(([l]) => [...l[2]]))];
    const sig = kinds.find(k => !seenKinds.has(k)) || '.';
    kinds.forEach(k => seenKinds.add(k));
    return `<section class="chapter"><h3 class="pf"><i class="${sprClass(sig, 'B')}"></i>${ch}</h3><div class="tiles">${entries.map(([l, i]) =>
      `<button class="tile pf" data-i="${i}" ${unlocked(i) ? '' : 'disabled'} aria-label="Level ${i + 1}, ${l[1]}, ${save.stars[i] || 0} stars${unlocked(i) ? '' : ', locked'}">
        <b>${i + 1}</b><span class="nm">${l[1]}</span><span class="stars">${starRow(save.stars[i] || 0)}</span></button>`).join('')}</div></section>`;
  }).join('');
  $('chapters').querySelectorAll('.tile').forEach(t => (t.onclick = () => playCampaign(+t.dataset.i)));
}

// ---------- levels ----------
let mode = 'campaign', idx = 0, streak = 0, lvl = null;
let history = [], busy = false, hinted = false, replaying = false, armed = -1, cells = [], idle;
const board = () => history[history.length - 1];
const limit = () => lvl.limit;
const used = () => history.length - 1;
const won = () => isWin(board(), lvl.types);
const lost = () => !won() && used() >= lvl.limit;
const starsNow = () => 1 + (used() <= lvl.par) + !hinted;

function playCampaign(i) {
  const [chapter, name, types, b, par, lim] = LEVELS[i];
  mode = 'campaign'; idx = i;
  play({ eyebrow: `${chapter} · ${i + 1} · ${name}`, types, board: b, par, limit: lim, scene: CHAPTER_SCENE[chapter] });
}

function playDaily() {
  const date = today(), rand = rng(+date.replace(/-/g, ''));
  let g = null;
  for (let k = 0; k < 40 && !g; k++) g = generate({ n: 5, par: 4, minPar: 3, kinds: randomKinds(rand, 2) }, rand, 60);
  g ||= fallback(); // shortcut: never seen in testing, but generation is random, so keep a safe level
  mode = 'daily';
  play({ eyebrow: `Daily village · ${date}`, date, ...g, limit: g.par + 1 });
}

const fallback = () => ({ types: LEVELS[15][2], board: LEVELS[15][3], par: LEVELS[15][4] });

function randomKinds(rand, count) {
  const pool = ['X', 'L', 'G', 'S', 'T'], kinds = {};
  for (let c = 0; c < count; c++) {
    const k = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    kinds[k] = 1 + Math.floor(rand() * (k === 'T' ? 3 : 2));
  }
  return kinds;
}

function playEndless(round) {
  mode = 'endless';
  const rand = rng((Math.random() * 2 ** 31) | 0);
  const n = round < 2 ? 3 : round < 5 ? 4 : 5;
  const par = Math.min(2 + Math.floor(round / 2), n === 3 ? 3 : 4);
  let g = null;
  for (let k = 0; k < 40 && !g; k++) g = generate({ n, par, minPar: Math.max(2, par - 1), kinds: randomKinds(rand, Math.min(Math.floor(round / 2), 3)) }, rand, 60);
  g ||= fallback();
  play({ eyebrow: `Endless · village ${round + 1} · streak ${streak}`, ...g, limit: g.par + 1, scene: ['day', 'sunset', 'night', 'dawn'][Math.floor(round / 3) % 4] });
}

function play(l) {
  lvl = l;
  setScene(l.scene || 'day');
  history = [l.board];
  hinted = false; replaying = false; armed = -1;
  build();
  show('game');
  render();
  resetIdle();
  // First time a campaign level brings in a new kind, introduce it.
  const fresh = [...new Set(l.types)].filter(k => k !== '.' && !save.seen.includes(k));
  if (mode === 'campaign' && fresh.length) {
    save.seen.push(...fresh);
    persist();
    villagerCard(fresh[0], true);
  }
}

function build() {
  const n = Math.sqrt(lvl.board.length);
  $('board').style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`; // minmax(0, …): columns never grow past the frame
  $('board').innerHTML = '';
  cells = [...lvl.board].map((_, i) => {
    const c = document.createElement('button');
    c.innerHTML = '<i class="v"></i><span class="tie" aria-hidden="true">=</span><i class="nx" aria-hidden="true"><i></i></i>';
    c.style.setProperty('--d', `${-((i * 7) % 5) * 0.24}s`); // desync the idle bob so the crowd shuffles
    c.disabled = fixed(lvl.types, i);
    c.addEventListener('click', e => tap(i, e));
    c.addEventListener('pointerenter', e => e.pointerType === 'mouse' && preview(i));
    c.addEventListener('pointerleave', e => e.pointerType === 'mouse' && preview(-1));
    c.addEventListener('focus', () => preview(i));
    c.addEventListener('blur', () => { armed = -1; preview(-1); });
    $('board').append(c);
    return c;
  });
  const kinds = [...new Set(lvl.types)];
  $('legend').innerHTML = kinds.map(k => `<button class="chip pf" data-k="${k}" aria-label="${KINDS[k].name}: what do they do?"><i class="${sprClass(k, 'B')}"></i><span>${KINDS[k].name}</span></button>`).join('');
  $('legend').querySelectorAll('.chip').forEach(c => (c.onclick = () => villagerCard(c.dataset.k)));
}

function paint(i, colour) {
  const n = Math.sqrt(cells.length), k = lvl.types[i] || '.';
  cells[i].className = `cell ${colour === '-' ? '' : colour} k-${KINDS[k].cls}`;
  const who = k === 'T' ? 'tree' : `${KINDS[k].name.toLowerCase()}, ${colour === 'B' ? 'blue' : 'red'}`;
  cells[i].setAttribute('aria-label', `row ${((i / n) | 0) + 1} column ${i % n + 1}, ${who}`);
}

function counter() {
  $('counter').innerHTML = `<span class="pips">${Array.from({ length: limit() }, (_, t) => `<i class="${t < used() ? 'used' : ''}"></i>`).join('')}</span>
    <span>Turn ${used()}/${limit()}</span>`;
  $('goals').innerHTML = `<span>${icon('star')}Clear</span><span class="${used() > lvl.par ? 'off' : ''}">${icon('star')}Par ${lvl.par}</span><span class="${hinted ? 'off' : ''}">${icon('star')}No hint</span>`;
}

function render() {
  const b = board(), ties = tied(b, lvl.types);
  b.split('').forEach((c, i) => {
    paint(i, c);
    cells[i].classList.toggle('tied', ties[i]);
    if (ties[i]) cells[i].setAttribute('aria-label', cells[i].getAttribute('aria-label') + ', tied, keeps colour');
  });
  $('eyebrow').textContent = lvl.eyebrow;
  $('goal').innerHTML = `Turn everyone <span class="blue">blue</span> <span class="dim">in ${limit()} turns.</span>`;
  counter();
  renderOverlay();
}

// ---------- the turn ----------
let lastPointer = 'mouse';
addEventListener('pointerdown', e => (lastPointer = e.pointerType), true);

function tap(i, e) {
  if (busy || replaying || won() || lost()) return;
  // Touch: first tap previews who would flip, second tap pins. Mouse and keyboard pin straight away.
  if (e.detail !== 0 && lastPointer === 'touch' && armed !== i) {
    armed = i;
    preview(i);
    $('msg').textContent = 'Tap again to pin.';
    return;
  }
  pin(i);
}

function preview(i) {
  cells.forEach(c => c.classList.remove('pv', 'armed'));
  if (i < 0 || busy || replaying || won() || lost() || fixed(lvl.types, i)) return;
  const b = board(), next = step(b, i, lvl.types);
  for (let j = 0; j < b.length; j++) {
    if (next[j] === b[j]) continue;
    cells[j].classList.add('pv');
    cells[j].querySelector('.nx > i').className = sprClass(lvl.types[j] || '.', next[j]);
  }
  if (armed === i) cells[i].classList.add('armed');
}

function pin(i) {
  $('msg').textContent = '';
  armed = -1;
  const before = board(), after = step(before, i, lvl.types), n = Math.sqrt(before.length);
  history.push(after);
  counter();
  sfx('sfx_pin');
  // Cascade: flips ripple outward from the pinned villager.
  busy = true;
  cells.forEach(c => c.classList.remove('tied', 'hint', 'pv', 'armed'));
  cells[i].classList.add('pinned');
  let maxDelay = 0;
  const waves = new Set(), flipped = [];
  for (let j = 0; j < after.length; j++) {
    if (after[j] === before[j]) continue;
    const d = Math.abs((j % n) - (i % n)) + Math.abs(((j / n) | 0) - ((i / n) | 0));
    maxDelay = Math.max(maxDelay, d * 120);
    setTimeout(() => { paint(j, after[j]); cells[j].classList.add('hop'); }, d * 120);
    waves.add(d);
    flipped.push(j);
  }
  waves.forEach(d => setTimeout(() => sfx('sfx_flip'), d * 120));
  setTimeout(() => quip(flipped, i, after), maxDelay + 60);
  setTimeout(() => {
    busy = false;
    render();
    if (won()) onWin(); else if (lost()) sfx('sfx_fail');
  }, maxDelay + 400);
}

// One villager reacts per turn: a special one if any flipped, otherwise the pinned one.
function quip(flipped, pinned, after) {
  if (replaying || !cells[pinned]) return;
  const special = flipped.filter(j => lvl.types[j] && lvl.types[j] !== '.');
  const pool = special.length ? special : flipped;
  const j = pool.length ? pool[Math.floor(Math.random() * pool.length)] : pinned;
  const lines = pool.length ? QUIPS[lvl.types[j] || '.'][after[j]] : QUIPS.pin;
  const n = Math.sqrt(cells.length), col = j % n;
  const el = document.createElement('span');
  el.className = `bubble pf ${col === 0 ? 'l' : col === n - 1 ? 'rt' : ''}`;
  el.textContent = lines[Math.floor(Math.random() * lines.length)];
  cells[j].append(el);
  setTimeout(() => el.remove(), 1800);
}

function onWin() {
  if (replaying) return;
  const s = starsNow();
  if (mode === 'campaign') save.stars[idx] = Math.max(save.stars[idx] || 0, s);
  if (mode === 'daily') save.daily[lvl.date] = Math.max(save.daily[lvl.date] || 0, s);
  if (mode === 'endless') { streak++; save.best = Math.max(save.best, streak); }
  persist();
  sfx('sfx_win');
  for (let k = 0; k < s; k++) setTimeout(() => sfx('sfx_star'), 450 + k * 280);
  $('game').classList.add('shake');
  confetti();
  $('progress').style.transform = `scaleX(${totalStars() / (LEVELS.length * 3)})`;
}

function renderOverlay() {
  const w = won(), l = lost();
  $('overlay').classList.toggle('show', w || l);
  $('overlay').classList.toggle('lost', l);
  if (!w && !l) return;
  const acts = [];
  const nextAct = mode === 'campaign'
    ? (idx < LEVELS.length - 1 ? ['Next level', 'next', () => playCampaign(idx + 1)] : ['All levels', 'next', () => show('select')])
    : mode === 'daily' ? ['Share result', 'share', share] : ['Next village', 'next', () => playEndless(streak)];
  if (w) {
    $('resultEyebrow').textContent = replaying ? `Best solution · ${lvl.par} turns`
      : mode === 'campaign' ? `Level ${idx + 1} cleared` : mode === 'daily' ? 'Daily village cleared' : `Streak ${streak}`;
    $('result').innerHTML = `<span class="win">Everyone's blue!</span>`;
    $('bigstars').innerHTML = replaying ? '' : [0, 1, 2].map(i => icon('star', i < starsNow() ? 'on' : '').replace('<svg', `<svg style="--i:${i}"`)).join('');
    $('bigstars').setAttribute('aria-label', `${starsNow()} of 3 stars`);
    $('result-note').textContent = replaying ? 'That is the shortest way.' : `Turns ${used()} / par ${lvl.par}${hinted ? ' · hint used' : ''}`;
    acts.push([...nextAct, true]);
    acts.push(['Watch best solution', 'play', replay]);
    if (!replaying && starsNow() < 3) acts.push(['Retry for 3 stars', 'restart', () => play(lvl)]);
  } else {
    $('resultEyebrow').textContent = 'Out of turns';
    $('result').textContent = 'The crowd won.';
    $('bigstars').innerHTML = '';
    if (mode === 'endless') {
      $('result-note').textContent = `Streak over at ${streak}. Best ${save.best}.`;
      acts.push(['New run', 'restart', () => { streak = 0; playEndless(0); }, true]);
      acts.push(['Menu', 'back', () => show('menu')]);
    } else {
      $('result-note').textContent = 'So close. Undo a turn or start over.';
      acts.push(['Try again', 'restart', restart, true, 'R']);
      acts.push(['Undo last turn', 'undo', undo, false, 'Z']);
    }
  }
  $('actions').innerHTML = acts.map(([label, ic, , primary, key], k) =>
    `<button class="btn pf ${primary ? 'primary' : ''}" ${primary ? 'id="next"' : ''} data-k="${k}">${icon(ic)}<span>${label}</span>${key ? `<kbd>${key}</kbd>` : ''}</button>`).join('');
  $('actions').querySelectorAll('button').forEach(b => (b.onclick = acts[b.dataset.k][2]));
  $('next').focus();
}

async function replay() {
  const s = solve(lvl.board, lvl.par, lvl.types);
  history = [lvl.board];
  replaying = true;
  render();
  for (const p of s) {
    if (!replaying) return;
    cells[p].classList.add('hint');
    await wait(650);
    if (!replaying) return;
    pin(p);
    while (busy) await wait(50);
  }
}

function share() {
  const n = Math.sqrt(lvl.board.length);
  const em = [...lvl.board].map((c, i) => (lvl.types[i] === 'T' ? '🌲' : lvl.types[i] === 'S' ? '🗿' : c === 'B' ? '🟦' : '🟥'));
  const rows = [];
  for (let k = 0; k < em.length; k += n) rows.push(em.slice(k, k + n).join(''));
  const text = `Peer Pressure · Daily ${lvl.date}\n${'⭐'.repeat(starsNow())}${'▪️'.repeat(3 - starsNow())} ${used()} turns (par ${lvl.par})\n${rows.join('\n')}`;
  const done = () => ($('result-note').textContent = 'Copied! Paste it anywhere.');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => showShare(text));
  else showShare(text);
}
function showShare(text) {
  $('result-note').innerHTML = '<textarea id="share-text" readonly aria-label="Your result"></textarea>';
  $('share-text').value = text;
  $('share-text').select();
}

function undo() {
  if (busy || (mode === 'endless' && lost()) || history.length < 2) return;
  replaying = false;
  history.pop();
  render();
}
function restart() {
  if (busy || (mode === 'endless' && lost())) return;
  replaying = false;
  history = [history[0]];
  render();
}
function hint() {
  if (busy || replaying || won() || lost()) return;
  const s = solve(board(), limit() - used(), lvl.types);
  if (!s) { $('msg').textContent = 'No win from here. Undo or restart.'; return; }
  hinted = true;
  counter();
  cells[s[0]].classList.add('hint');
}

function confetti() {
  if (reduced()) return;
  const colours = ['#2997ff', '#86b6ef', '#ffd60a', '#f5f5f7'];
  for (let k = 0; k < 32; k++) {
    const p = document.createElement('i');
    p.className = 'bit';
    p.style.cssText = `left:${Math.random() * 100}vw;background:${colours[k % 4]};--t:${0.9 + Math.random() * 0.9}s;--dx:${(Math.random() - 0.5) * 160}px;--rot:${Math.random() * 720}deg`;
    document.body.append(p);
    setTimeout(() => p.remove(), 2000);
  }
}
$('game').addEventListener('animationend', e => e.target === $('game') && $('game').classList.remove('shake'));

// ---------- cards ----------
function modal(html) {
  $('modal-card').innerHTML = html;
  $('modal').classList.add('show');
  $('modal-ok').onclick = closeModal;
  $('modal-ok').focus();
}
function closeModal() { $('modal').classList.remove('show'); }
function villagerCard(k, isNew) {
  modal(`<p class="eyebrow">${isNew ? 'New in this village' : 'Who is this?'}</p><i class="modal-spr ${sprClass(k, 'B')}"></i>
    <h2 id="modal-title">${KINDS[k].name}</h2><p>${KINDS[k].rule}</p>
    <div class="actions"><button class="btn primary pf" id="modal-ok">Got it</button></div>`);
}
function howTo() {
  modal(`<p class="eyebrow">How to play</p><h2 id="modal-title">Turn everyone <span class="blue">blue</span>.</h2>
    <div class="rules">
      <p>Each turn, <b>pin one villager</b>. Then everyone else at once copies the <b>majority</b> of their up, down, left and right neighbours. A tie keeps their colour. The pin only lasts that turn.</p>
      <ul>${Object.keys(KINDS).map(k => `<li><i class="${sprClass(k, 'B')}"></i><p><b>${KINDS[k].name}.</b> ${KINDS[k].rule}</p></li>`).join('')}</ul>
      <p><b>Stars:</b> one for clearing, one for using no more than par turns, one for clearing without a hint.</p>
      <p><b>Tips:</b> hover (or tap once) to preview who flips. An = badge means a tie: that villager keeps their colour.</p>
    </div>
    <div class="actions"><button class="btn primary pf" id="modal-ok">Got it</button></div>`);
}

// ---------- input ----------
// Level 1 only: show the hint ring after 8 seconds without input (free, doesn't cost the hint star).
function resetIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => {
    if (mode !== 'campaign' || idx !== 0 || busy || won() || document.body.dataset.screen !== 'game') return;
    const s = solve(board(), limit() - used(), lvl.types);
    if (s) cells[s[0]].classList.add('hint');
  }, 8000);
}
addEventListener('pointerdown', () => lvl && resetIdle());
addEventListener('keydown', () => lvl && resetIdle());

$('undo').onclick = undo;
$('restart').onclick = restart;
$('hintBtn').onclick = hint;
$('back').onclick = () => { replaying = false; show(document.body.dataset.screen === 'game' && mode === 'campaign' ? 'select' : 'menu'); };
$('help').onclick = howTo;
$('howto-btn').onclick = howTo;
$('daily-btn').onclick = playDaily;
$('endless-btn').onclick = () => { streak = 0; playEndless(0); };
$('modal').addEventListener('click', e => e.target === $('modal') && closeModal());
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if ($('modal').classList.contains('show')) closeModal(); return; }
  if ($('modal').classList.contains('show') || document.body.dataset.screen !== 'game') return;
  const k = e.key.toLowerCase();
  if (k === 'z') undo(); else if (k === 'r') restart(); else if (k === 'h') hint();
  // Arrow keys move between cells.
  const at = cells.indexOf(document.activeElement), n = Math.sqrt(cells.length);
  const delta = { arrowup: -n, arrowdown: n, arrowleft: -1, arrowright: 1 }[k];
  if (at >= 0 && delta) {
    e.preventDefault();
    for (let j = at + delta; j >= 0 && j < cells.length && (Math.abs(delta) === n || ((j / n) | 0) === ((at / n) | 0)); j += delta)
      if (!cells[j].disabled) { cells[j].focus(); break; }
  }
});

if (location.search.includes('dev')) LEVELS.forEach(([, name, types, b, par, lim], i) => {
  const s = solve(b, par, types);
  console.assert(s && s.length === par && !solve(b, par - 1, types) && !idleWins(b, types) && lim >= par, `level ${i + 1} (${name}) is broken`);
});
show('menu');
</script>
</body>
</html>
